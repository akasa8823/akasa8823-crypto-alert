name: crypto-signal-screener

on:
  schedule:
    # UTC基準。デフォルトは30分おき。頻度を変えたい場合はここを編集してください。
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # 手動実行用（Actionsタブから "Run workflow" で即実行できます）

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python crypto_signal_screener.py

      - name: Commit updated state/results
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          files="alert_state.json signals_result.csv backtest_report.csv alerts_log.csv accuracy_report.csv signal_accuracy.csv notify_performance_log.csv"
          existing=""
          for f in $files; do
            if [ -f "$f" ]; then existing="$existing $f"; fi
          done
          if [ -z "$existing" ]; then
            echo "no files to commit"
            exit 0
          fi
          git add $existing
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "update signal state [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push failed, retrying ($i)..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "push failed after retries"
          exit 1
