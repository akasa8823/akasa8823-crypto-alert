      - name: Commit updated state/results
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          files="alert_state.json signals_result.csv backtest_report.csv alerts_log.csv accuracy_report.csv signal_accuracy.csv"
          existing=""
          for f in $files; do
            if [ -f "$f" ]; then existing="$existing $f"; fi
          done
          if [ -z "$existing" ]; then
            echo "no files to commit"
            exit 0
          fi
          git add $existing
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "update signal state [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push failed, retrying ($i)..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "push failed after retries"
          exit 1
