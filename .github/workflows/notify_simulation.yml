name: crypto-notify-simulation

on:
  workflow_dispatch: {}   # 手動実行専用（Actionsタブから "Run workflow" で実行してください）

permissions:
  contents: write

jobs:
  notify-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notification simulation
        run: python notify_simulation.py

      - name: Commit report
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          files="notify_simulation_trades.csv notify_simulation_report.md"
          existing=""
          for f in $files; do
            if [ -f "$f" ]; then existing="$existing $f"; fi
          done
          if [ -n "$existing" ]; then
            git add $existing
            git diff --staged --quiet || git commit -m "update notify simulation report [skip ci]"
            git push
          else
            echo "no files to commit"
          fi
