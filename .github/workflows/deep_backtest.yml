      - name: Commit report
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          files="deep_backtest_by_score.csv deep_backtest_by_signal.csv deep_backtest_by_combo.csv deep_backtest_coverage.csv deep_backtest_report.md"
          existing=""
          for f in $files; do
            if [ -f "$f" ]; then existing="$existing $f"; fi
          done
          if [ -z "$existing" ]; then
            echo "no files to commit"
            exit 0
          fi
          git add $existing
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "update deep backtest report [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push failed, retrying ($i)..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after retries"
          exit 1
