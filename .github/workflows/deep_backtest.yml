name: crypto-deep-backtest

on:
  workflow_dispatch: {}   # 手動実行専用（Actionsタブから "Run workflow" で実行してください）

permissions:
  contents: write

jobs:
  deep-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deep backtest
        run: python deep_backtest.py

      - name: Commit report
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          files="deep_backtest_by_score.csv deep_backtest_by_signal.csv deep_backtest_by_combo.csv deep_backtest_coverage.csv deep_backtest_report.md"
          existing=""
          for f in $files; do
            if [ -f "$f" ]; then existing="$existing $f"; fi
          done
          if [ -n "$existing" ]; then
            git add $existing
            git diff --staged --quiet || git commit -m "update deep backtest report [skip ci]"
            git push
          else
            echo "no files to commit"
          fi
