      - name: Commit report
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          files="notify_simulation_matrix_trades.csv notify_simulation_matrix.csv notify_simulation_matrix_report.md"
          existing=""
          for f in $files; do
            if [ -f "$f" ]; then existing="$existing $f"; fi
          done
          if [ -z "$existing" ]; then
            echo "no files to commit"
            exit 0
          fi
          git add $existing
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "update notify simulation matrix report [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push failed, retrying ($i)..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after retries"
          exit 1
